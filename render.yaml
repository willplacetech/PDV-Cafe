# Blueprint de teste / demo white-label.
# No painel Render: confirme a branch Generico (ou a branch de apresentação).
# Não use este arquivo para sobrescrever produção sem revisar nomes e URLs.
services:
  - type: web
    runtime: node
    name: pdv-api-generico
    branch: Generico
    region: oregon
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: PdvGenerico
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EXIGIR_AUTORIZACAO_GERENTE
        value: 'true'
      - key: JWT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    runtime: static
    name: pdv-web-generico
    branch: Generico
    rootDir: front-end
    buildCommand: npm ci && VITE_API_URL="${API_PUBLIC_URL%/}/api" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: API_PUBLIC_URL
        sync: false
      - key: VITE_APP_NAME
        value: PDV
      - key: VITE_APP_THEME_COLOR
        value: '#4f9d6a'
      - key: VITE_SENTRY_DSN
        sync: false
