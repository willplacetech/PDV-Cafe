# Somente ambiente de teste. Criar um NOVO Blueprint, separado da produção.
services:
  - type: web
    runtime: node
    name: pdv-cafe-api-teste-off-delivery
    branch: feature/pwa-offline-sincronizacao
    region: oregon
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: TesteOffDelivery
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DELIVERY_ADMIN_EMAIL
        sync: false
      - key: DELIVERY_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://pdv-delivery-9j0a.onrender.com
      - key: DELIVERY_PUBLIC_URL
        value: https://pdv-delivery-9j0a.onrender.com
      - key: EXIGIR_AUTORIZACAO_GERENTE
        value: 'true'
      - key: JWT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    runtime: static
    name: pdv-cafe-web-teste-off-delivery
    branch: feature/pwa-offline-sincronizacao
    rootDir: front-end
    # Render não interpola valores YAML. A URL pública recebe /api no build.
    buildCommand: npm ci && VITE_API_URL="${API_PUBLIC_URL%/}/api" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: API_PUBLIC_URL
        value: https://restaurante-pdv-back.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
